name: Verify profile

on:
  pull_request:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: extractions/setup-just@v3
      - name: Keep the build of jlog
        id: jlog
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/jlog
          key: jlog-v0.1.1-${{ runner.os }}
      - name: Install jlog v0.1.1, which the jnterfaces installer needs
        if: steps.jlog.outputs.cache-hit != 'true'
        run: cargo install --locked --git https://github.com/rahuldave/jlog --tag v0.1.1
      - name: Get nossaifd, whose checker prose-check runs
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/rahuldave/nossaifd.git "$RUNNER_TEMP/nossaifd"
          git -C "$RUNNER_TEMP/nossaifd" checkout --quiet 7ab9e940bfdfad994008c1b00234572547ceaf9a
          echo "NOSSAIFD_CHECK=$RUNNER_TEMP/nossaifd/check.py" >> "$GITHUB_ENV"
      - name: Get the packages that the live lab installs
        shell: bash
        run: |
          set -euo pipefail
          packages="$RUNNER_TEMP/packages"
          mkdir -p "$packages"
          while read -r name commit; do
            git clone --quiet "https://github.com/rahuldave/$name.git" "$packages/$name"
            git -C "$packages/$name" checkout --quiet "$commit"
          done <<'EOF'
          jnterfaces 338ca39105397177d51fdc1bbb555b80f2bc22de
          nossaifd 7ab9e940bfdfad994008c1b00234572547ceaf9a
          EOF
          echo "SKILL_PACKAGES_DIR=$packages" >> "$GITHUB_ENV"
          echo "JNTERFACES_INSTALLER=$packages/jnterfaces/scripts/install_stack.py" >> "$GITHUB_ENV"
      - name: Run every check of the repository
        run: just check
